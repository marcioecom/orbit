name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

  pulumi-preview:
    runs-on: ubuntu-latest
    needs: typecheck
    # Only runs when the real cloud/Pulumi credentials are configured as repository secrets.
    # Forks and contributors without access to those secrets still get a green typecheck job.
    if: ${{ github.repository == github.event.pull_request.base.repo.full_name || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check Pulumi credentials are configured
        id: creds
        run: |
          if [ -n "${{ secrets.PULUMI_ACCESS_TOKEN }}" ] && [ -n "${{ secrets.KUBECONFIG_BASE64 }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pulumi/actions@v6
        if: steps.creds.outputs.available == 'true'
        with:
          command: preview
          stack-name: orbit-eu
          work-dir: .
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}

      - name: Skip preview (no credentials configured)
        if: steps.creds.outputs.available != 'true'
        run: echo "PULUMI_ACCESS_TOKEN / KUBECONFIG_BASE64 not set — skipping pulumi preview."
