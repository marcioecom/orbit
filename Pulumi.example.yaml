config:
  orbit:clusterName: orbit-eu
  orbit:storageClassName: hcloud-volumes
  # Select a single data location after measuring private node-to-node latency.
  # orbit:dataNodeSelector: topology.kubernetes.io/region=fsn1
  orbit:cloudflareAccountId: REPLACE_ME
  orbit:cloudflareZoneId: REPLACE_ME
  orbit:backupBucketName: orbit-eu-backups
  orbit:cloudflaredEnabled: false
  orbit:tailscaleOperatorEnabled: true
  orbit:infisicalSiteUrl: https://infisical.REPLACE_WITH_YOUR_TAILNET.ts.net
  # orbit:infisicalSmtpFromAddress: platform@REPLACE_WITH_VERIFIED_DOMAIN
  # orbit:infisicalSmtpFromName: Infisical
  orbit:ghcrUsername: REPLACE_WITH_GITHUB_USERNAME

  # Project-owned configuration. Each project reads its own `pulumi.Config`
  # namespace (see `src/projects/<project>/config.ts`); workload images are
  # managed by each project's own CI/CD pipeline.
  echo:apiHostname: echo-api.REPLACE_WITH_CLOUDFLARE_ZONE
  echo:webOrigin: https://REPLACE_WITH_ECHO_WEB_ORIGIN
  echo:infisicalProjectSlug: REPLACE_WITH_ECHO_INFISICAL_PROJECT_SLUG
  # Defaults to "echo-storage" if unset. This bucket was created manually in
  # the Cloudflare dashboard, so only set this if you name it differently.
  # echo:storageBucketName: echo-storage
  nightmint:infisicalProjectSlug: REPLACE_WITH_NIGHTMINT_INFISICAL_PROJECT_SLUG

# Set these with `pulumi config set --secret`, never in this file:
# - kubeconfig
# - backupAccessKeyId
# - backupSecretAccessKey
# - echo:postgresPassword
# - echo:valkeyPassword
# - echo:infisicalUniversalAuthClientId and echo:infisicalUniversalAuthClientSecret
#   from the echo machine identity created in the Infisical UI
# - nightmint:infisicalUniversalAuthClientId and nightmint:infisicalUniversalAuthClientSecret
#   from the NightMint machine identity created in the Infisical UI
# - ghcrPullToken (GitHub PAT with read:packages, shared by all projects pulling from GHCR)
# - infisicalEncryptionKey
# - infisicalAuthSecret
# - infisicalPostgresPassword
# - infisicalRedisPassword
# - infisicalResendApiKey when infisicalSmtpFromAddress is set
# - grafanaAdminPassword
# - tailscaleOAuthClientId and tailscaleOAuthClientSecret when tailscaleOperatorEnabled=true
#
# The application's own R2 API credentials (R2_ACCESS_KEY_ID /
# R2_SECRET_ACCESS_KEY consumed by apps/api and apps/worker in the echo
# repository) are not Pulumi config at all — they live directly in Infisical
# under the echo project's /api and /worker paths. See `src/projects/echo/storage.ts`.
